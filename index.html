<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machinations</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- ヘッダー -->
        <header id="header">
            <div class="header-left">
                <svg class="header-logo" viewBox="0 0 28 28" width="24" height="24">
                    <circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="2.2"/>
                    <circle cx="14" cy="14" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="14" y1="2" x2="14" y2="9" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="14" y1="19" x2="14" y2="26" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="2" y1="14" x2="9" y2="14" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="19" y1="14" x2="26" y2="14" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <h1>Machinations</h1>
            </div>
            <div class="header-center">
                <div class="header-group">
                    <button id="btn-new" class="header-btn" data-i18n-title="header.new.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 2h8l4 4v12H4V2z" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="7" y1="11" x2="13" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="8" x2="10" y2="14" stroke="currentColor" stroke-width="1.5"/></svg>
                        <span data-i18n="header.new">新規</span>
                    </button>
                    <button id="btn-save" class="header-btn" data-i18n-title="header.save.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 3h11l3 3v11H3V3z" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="6" y="3" width="7" height="5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="5" y="12" width="10" height="5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                        <span data-i18n="header.save">保存</span>
                    </button>
                    <button id="btn-load" class="header-btn" data-i18n-title="header.load.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M2 6h5l2-3h7v14H2V6z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                        <span data-i18n="header.load">読込</span>
                    </button>
                    <input type="file" id="file-input" accept=".json" style="display:none">
                </div>
                <span class="separator"></span>
                <div class="header-group">
                    <button id="btn-undo" class="header-btn icon-only" data-i18n-title="header.undo.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 8l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11h11a4 4 0 010 8H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                    <button id="btn-redo" class="header-btn icon-only" data-i18n-title="header.redo.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M15 8l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 11H7a4 4 0 000 8h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <span class="separator"></span>
                <div class="header-group">
                    <button id="btn-samples" class="header-btn" data-i18n-title="header.samples.title">
                        <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="3" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1"/><line x1="10" y1="8" x2="10" y2="17" stroke="currentColor" stroke-width="1"/></svg>
                        <span data-i18n="header.samples">サンプル</span>
                    </button>
                </div>
            </div>
            <div class="header-right">
                <select id="locale-select" class="locale-select" data-i18n-title="header.locale.title" aria-label="Language">
                    <option value="ja">JA</option>
                    <option value="en">EN</option>
                </select>
                <button id="btn-theme" class="header-btn icon-only" data-i18n-title="header.theme.title">&#127769;</button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <div id="main-content">
            <div class="main-workspace">
                <!-- 水平ツールバー -->
                <div id="toolbar">
                    <button class="tool-btn active" data-tool="select" data-i18n-title="toolbar.select.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" fill="currentColor"/></svg>
                    </button>
                    <span class="toolbar-sep"></span>
                    <button class="tool-btn" data-tool="pool" data-i18n-title="toolbar.pool.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="source" data-i18n-title="toolbar.source.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="12,2 22,22 2,22" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="drain" data-i18n-title="toolbar.drain.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="12,22 22,2 2,2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="converter" data-i18n-title="toolbar.converter.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="2,12 12,2 22,12 12,22" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(45 12 12)"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="gate" data-i18n-title="toolbar.gate.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="trader" data-i18n-title="toolbar.trader.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="register" data-i18n-title="toolbar.register.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="endCondition" data-i18n-title="toolbar.endCondition.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="chart" data-i18n-title="toolbar.chart.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="5,18 9,10 13,14 17,6 21,8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="delay" data-i18n-title="toolbar.delay.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="7" x2="16" y2="17" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="queue" data-i18n-title="toolbar.queue.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="7" x2="8" y2="17" stroke="currentColor" stroke-width="1" opacity="0.4"/><line x1="12" y1="7" x2="12" y2="17" stroke="currentColor" stroke-width="1" opacity="0.4"/><line x1="16" y1="7" x2="16" y2="17" stroke="currentColor" stroke-width="1" opacity="0.4"/></svg>
                    </button>
                    <span class="toolbar-sep"></span>
                    <button class="tool-btn" data-tool="resourceConnection" data-i18n-title="toolbar.resourceConnection.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="2" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2"/><polygon points="18,8 24,12 18,16" fill="currentColor"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="stateConnection" data-i18n-title="toolbar.stateConnection.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="2" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2" stroke-dasharray="4,3"/><polygon points="18,8 24,12 18,16" fill="currentColor"/></svg>
                    </button>
                    <span class="toolbar-sep"></span>
                    <button class="tool-btn" data-tool="textLabel" data-i18n-title="toolbar.textLabel.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">T</text></svg>
                    </button>
                    <button class="tool-btn" data-tool="group" data-i18n-title="toolbar.group.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="delete" data-i18n-title="toolbar.delete.title">
                        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                </div>

                <!-- SVGキャンバス -->
                <main id="canvas-container">
                    <div id="minimap">
                        <canvas id="minimap-canvas" width="180" height="120"></canvas>
                    </div>
                    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                            </marker>
                            <marker id="arrowhead-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#ccc"/>
                            </marker>
                            <marker id="arrowhead-state" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                            </marker>
                            <marker id="arrowhead-state-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
                            </marker>
                            <marker id="trigger-marker" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
                                <path d="M3,2 L6,10 L9,2" fill="none" stroke="#ff9800" stroke-width="2"/>
                            </marker>
                            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.3" opacity="0.5" class="grid-line"/>
                            </pattern>
                        </defs>
                        <rect id="grid-bg" width="100%" height="100%" fill="url(#grid)"/>
                        <g id="canvas-group">
                            <g id="connections-layer"></g>
                            <g id="animations-layer"></g>
                            <g id="nodes-layer"></g>
                        </g>
                        <g id="temp-connection" style="pointer-events:none"></g>
                    </svg>
                </main>
            </div>

            <!-- プロパティパネル -->
            <aside id="properties-panel">
                <h3 data-i18n="props.title">プロパティ</h3>
                <div id="properties-content">
                    <p class="placeholder" data-i18n="props.placeholder">要素を選択してください</p>
                </div>
            </aside>
        </div>

        <!-- チャートデータパネル -->
        <div id="chart-panel" style="display:none">
            <div id="chart-panel-header">
                <span id="chart-panel-title" data-i18n="chart.title">Simulation Charts</span>
                <div id="chart-panel-actions">
                    <button id="chart-panel-toggle" class="chart-action-btn" data-i18n-title="chart.toggle.title">
                        <svg viewBox="0 0 20 20" width="14" height="14"><rect x="2" y="2" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="18" y2="8" stroke="currentColor" stroke-width="1"/><line x1="8" y1="8" x2="8" y2="18" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button id="chart-panel-close" class="chart-action-btn" data-i18n-title="chart.close.title">&times;</button>
                </div>
            </div>
            <div id="chart-panel-body">
                <div id="chart-graph">
                    <svg id="chart-svg" width="100%" height="100%"></svg>
                    <div id="chart-legend"></div>
                </div>
                <div id="chart-table-view" style="display:none">
                    <table id="chart-table">
                        <thead id="chart-thead"><tr></tr></thead>
                        <tbody id="chart-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- シミュレーションバー -->
        <div id="sim-bar">
            <div class="sim-bar-left">
                <button id="btn-run" class="sim-btn sim-btn-run" data-i18n="sim.run" data-i18n-title="sim.run.title">▶ 実行</button>
                <button id="btn-step" class="sim-btn sim-btn-step" data-i18n="sim.step" data-i18n-title="sim.step.title">⏭ ステップ</button>
                <button id="btn-stop" class="sim-btn sim-btn-stop" data-i18n="sim.stop" data-i18n-title="sim.stop.title" disabled>◼ 停止</button>
                <button id="btn-reset" class="sim-btn sim-btn-reset" data-i18n="sim.reset" data-i18n-title="sim.reset.title">⟳ リセット</button>
            </div>
            <div class="sim-bar-center">
                <label class="speed-label">
                    <svg viewBox="0 0 20 20" width="14" height="14"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 2v6l4 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <input type="range" id="speed-slider" min="1" max="20" value="5" data-i18n-title="sim.speed.title">
                    <span id="speed-value">5</span>
                </label>
            </div>
            <div class="sim-bar-right">
                <button id="btn-quickrun" class="sim-btn sim-btn-quick" data-i18n="sim.quick" data-i18n-title="sim.quick.title">⚡ 高速</button>
                <button id="btn-multirun" class="sim-btn sim-btn-stats" data-i18n="sim.stats" data-i18n-title="sim.stats.title">📊 統計</button>
                <button id="feedback-btn" class="sim-btn sim-btn-feedback" data-i18n="sim.feedback" data-i18n-title="sim.feedback.title">💬 フィードバック</button>
            </div>
        </div>

        <!-- ステータスバー -->
        <footer id="statusbar">
            <span id="status-step">ステップ: 0</span>
            <span class="separator"></span>
            <span id="status-nodes">ノード: 0</span>
            <span class="separator"></span>
            <span id="status-connections">接続: 0</span>
            <span class="separator"></span>
            <span id="status-resources">総リソース: 0</span>
            <span class="separator"></span>
            <span id="status-info" data-i18n="status.ready">準備完了</span>
        </footer>
    </div>

    <!-- サンプルモーダル -->
    <div id="sample-modal" class="modal-overlay" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="sample.modal.title">サンプルダイアグラム</h2>
                <button id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="sample-category">
                    <h3 data-i18n="sample.cat.basic">基本パターン</h3>
                    <div class="sample-grid">
                        <button class="sample-card" data-sample="economy">
                            <strong data-i18n="sample.economy.title">シンプル経済</strong>
                            <span data-i18n="sample.economy.desc">Source → Pool → Drain の基本フロー</span>
                        </button>
                        <button class="sample-card" data-sample="engine">
                            <strong data-i18n="sample.engine.title">ダイナミックエンジン</strong>
                            <span data-i18n="sample.engine.desc">フィードバックで生産力が変動</span>
                        </button>
                        <button class="sample-card" data-sample="monopoly">
                            <strong data-i18n="sample.monopoly.title">正のフィードバック</strong>
                            <span data-i18n="sample.monopoly.desc">資産が収入を増やす「富める者がさらに富む」</span>
                        </button>
                    </div>
                </div>
                <div class="sample-category">
                    <h3 data-i18n="sample.cat.patterns">デザインパターン（付録B）</h3>
                    <div class="sample-grid">
                        <button class="sample-card" data-sample="staticEngine">
                            <strong data-i18n="sample.staticEngine.title">静的エンジン</strong>
                            <span data-i18n="sample.staticEngine.desc">固定レートで安定したリソース生産</span>
                        </button>
                        <button class="sample-card" data-sample="converterEngine">
                            <strong data-i18n="sample.converterEngine.title">コンバーターエンジン</strong>
                            <span data-i18n="sample.converterEngine.desc">2つのリソースの相互変換ループ</span>
                        </button>
                        <button class="sample-card" data-sample="staticFriction">
                            <strong data-i18n="sample.staticFriction.title">静的摩擦</strong>
                            <span data-i18n="sample.staticFriction.desc">固定維持コストがリソースを消費</span>
                        </button>
                        <button class="sample-card" data-sample="dynamicFriction">
                            <strong data-i18n="sample.dynamicFriction.title">動的摩擦</strong>
                            <span data-i18n="sample.dynamicFriction.desc">保有量に比例して維持コスト増加</span>
                        </button>
                        <button class="sample-card" data-sample="attrition">
                            <strong data-i18n="sample.attrition.title">消耗（Attrition）</strong>
                            <span data-i18n="sample.attrition.desc">時間経過でリソースが劣化・減少</span>
                        </button>
                        <button class="sample-card" data-sample="negativeFeedback">
                            <strong data-i18n="sample.negativeFeedback.title">負のフィードバック</strong>
                            <span data-i18n="sample.negativeFeedback.desc">バランスを取り戻す「ゴム紐効果」</span>
                        </button>
                    </div>
                </div>
                <div class="sample-category">
                    <h3 data-i18n="sample.cat.determinability">決定性の具体化（Determinability Patterns）</h3>
                    <div class="sample-grid">
                        <button class="sample-card" data-sample="playerSkill">
                            <strong data-i18n="sample.playerSkill.title">Player Skill: テトリス型</strong>
                            <span data-i18n="sample.playerSkill.desc">スキルレベルがブロック消去速度を決定</span>
                        </button>
                        <button class="sample-card" data-sample="metaDynamic">
                            <strong data-i18n="sample.metaDynamic.title">Meta-dynamic: 攻守投資</strong>
                            <span data-i18n="sample.metaDynamic.desc">攻撃/防御の戦略的投資バランス</span>
                        </button>
                        <button class="sample-card" data-sample="multiplayerDynamic">
                            <strong data-i18n="sample.multiplayerDynamic.title">Multiplayer-dynamic: 対戦</strong>
                            <span data-i18n="sample.multiplayerDynamic.desc">読み合いがダメージ効率を左右する</span>
                        </button>
                    </div>
                </div>
                <div class="sample-category">
                    <h3 data-i18n="sample.cat.games">実ゲーム分析</h3>
                    <div class="sample-grid">
                        <button class="sample-card" data-sample="riskCore">
                            <strong data-i18n="sample.riskCore.title">リスク: コアメカニクス</strong>
                            <span data-i18n="sample.riskCore.desc">軍隊と領土の攻防フィードバック</span>
                        </button>
                        <button class="sample-card" data-sample="simwar">
                            <strong data-i18n="sample.simwar.title">SimWar: 2プレイヤーRTS</strong>
                            <span data-i18n="sample.simwar.desc">2プレイヤーの経済と軍事の対戦</span>
                        </button>
                        <button class="sample-card" data-sample="diceGate">
                            <strong data-i18n="sample.diceGate.title">ダイスゲート</strong>
                            <span data-i18n="sample.diceGate.desc">D6ダイスによる確率的リソース分配</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- フィードバックモーダル -->
    <div id="feedback-modal" class="modal-overlay" style="display:none">
        <div class="modal-content" style="width:480px">
            <div class="modal-header">
                <h2 data-i18n="feedback.modal.title">フィードバック</h2>
                <button class="modal-close-btn" id="feedback-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="prop-group">
                    <label data-i18n="feedback.category">カテゴリ</label>
                    <select id="feedback-category">
                        <option value="enhancement" data-i18n="feedback.cat.enhancement">新規実装</option>
                        <option value="bug" data-i18n="feedback.cat.bug">バグ</option>
                        <option value="improvement" data-i18n="feedback.cat.improvement">改善要望</option>
                        <option value="other" data-i18n="feedback.cat.other">その他</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label data-i18n="feedback.title">タイトル</label>
                    <input type="text" id="feedback-title" data-i18n-placeholder="feedback.title.placeholder" placeholder="概要を入力">
                </div>
                <div class="prop-group">
                    <label data-i18n="feedback.body">詳細</label>
                    <textarea id="feedback-body" rows="5" data-i18n-placeholder="feedback.body.placeholder" placeholder="詳しい内容を記述してください"></textarea>
                </div>
                <button id="feedback-submit" class="feedback-submit-btn" data-i18n="feedback.submit">GitHub Issue を作成</button>
            </div>
        </div>
    </div>
